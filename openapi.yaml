components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      title: Error response
      type: object
      properties:
        message:
          type: string
          example: Not authorized
      required:
        - message
    DeleteMessage:
      title: Delete confirmation message
      type: object
      properties:
        message:
          type: string
          example: Education deleted
      required:
        - message
    EducationFields:
      title: Education fields
      description: Editable fields of an education entry.
      type: object
      properties:
        institution:
          type: string
          example: Sri Venkateswara University
        location:
          type: string
          nullable: true
          example: Tirupati, Andhra Pradesh
        degree:
          type: string
          example: B.Tech Computer Science
        branch:
          type: string
          nullable: true
          example: Computer Science and Engineering
        start_date:
          type: string
          example: "2020-08-01"
        end_date:
          type: string
          nullable: true
          example: "2024-05-30"
        progress:
          type: string
          nullable: true
          example: Completed
        is_current:
          type: boolean
          nullable: true
          example: false
        display_order:
          type: integer
          nullable: true
          example: 1
      required:
        - institution
        - degree
        - start_date
    Education:
      title: Education
      description: An education entry.
      allOf:
        - $ref: "#/components/schemas/EducationFields"
        - type: object
          properties:
            _id:
              type: string
              pattern: ^[0-9a-fA-F]{24}$
              example: 64f1a2b3c4d5e6f7a8b9c0d1
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            __v:
              type: integer
              example: 0
          required:
            - _id
    ExperienceFields:
      title: Experience fields
      description: Editable fields of an experience entry.
      type: object
      properties:
        company:
          type: string
          example: Agile FAQs Technology Pvt. Ltd.
        role:
          type: string
          example: Software Intern
        location:
          type: string
          nullable: true
          example: Remote
        type:
          type: string
          nullable: true
          example: Internship
        start_date:
          type: string
          example: "2026-07-01"
        end_date:
          type: string
          nullable: true
          example: "2026-08-02"
        is_current:
          type: boolean
          nullable: true
          example: false
        description:
          type: string
          nullable: true
          example: Worked on contract testing with Specmatic and OpenAPI.
        skills:
          type: string
          nullable: true
          example: Java, Spring Boot, OpenAPI, Specmatic
        display_order:
          type: integer
          nullable: true
          example: 1
      required:
        - company
        - role
        - start_date
    Experience:
      title: Experience
      description: An experience entry.
      allOf:
        - $ref: "#/components/schemas/ExperienceFields"
        - type: object
          properties:
            _id:
              type: string
              pattern: ^[0-9a-fA-F]{24}$
              example: 64f1a2b3c4d5e6f7a8b9c0d2
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            __v:
              type: integer
              example: 0
          required:
            - _id
    SkillFields:
      title: Skill fields
      description: Editable fields of a skill.
      type: object
      properties:
        name:
          type: string
          example: Java
        category:
          type: string
          enum:
            - frontend
            - backend
            - database
            - tools
            - programming
            - other
          example: programming
        icon_url:
          type: string
          nullable: true
          example: https://example.com/icons/java.svg
        proficiency:
          type: integer
          nullable: true
          example: 80
      required:
        - name
        - category
    Skill:
      title: Skill
      description: A skill entry.
      allOf:
        - $ref: "#/components/schemas/SkillFields"
        - type: object
          properties:
            _id:
              type: string
              pattern: ^[0-9a-fA-F]{24}$
              example: 64f1a2b3c4d5e6f7a8b9c0d3
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            __v:
              type: integer
              example: 0
          required:
            - _id
    AboutFields:
      title: About fields
