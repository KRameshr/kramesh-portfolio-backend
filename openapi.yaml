openapi: 3.0.1
info:
  title: Kramesh Portfolio Backend API
  description: API for managing portfolio content (education, experience, skills, about, projects, blogs, contact, certifications, auth).
  version: "1.0"
servers:
  - url: http://localhost:3000/api
tags:
  - name: education
  - name: experience
  - name: skills
  - name: about
  - name: projects
  - name: blogs
  - name: contact
  - name: certifications
  - name: auth
paths:
  /education:
    get:
      tags:
        - education
      operationId: getEducation
      summary: List all education entries
      description: Returns an array of education records, sorted by display_order.
      responses:
        200:
          description: Education entries found and returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Education"
        500:
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                server_error:
                  $ref: openapi_examples/education_get_server_error.json
      parameters:
        - name: X-Simulate-Error
          in: header
          required: false
          schema:
            type: string
          description: Test-only header (NODE_ENV=test) to simulate a 500 server error for contract testing.
    post:
      tags:
        - education
      operationId: createEducation
      summary: Create an education entry
      description: Creates a new education record. Requires admin authentication.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EducationFields"
            examples:
              create_education_success:
                $ref: openapi_examples/create_education_success.json
      responses:
        201:
          description: Education entry created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Education"
        400:
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  $ref: openapi_examples/education_post_unauthorized.json
        500:
          description: Server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                server_error:
                  $ref: openapi_examples/education_post_server_error.json
      parameters:
        - name: X-Simulate-Error
          in: header
          required: false
          schema:
            type: string
          description: Test-only header (NODE_ENV=test) to simulate a 500 server error for contract testing.
  /education/{id}:
    put:
      tags:
        - education
      operationId: updateEducation
      summary: Update an education entry by ID
      description: Updates an existing education record. Requires admin authentication.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          example: 64f1a2b3c4d5e6f7a8b9c0d1
        - name: X-Simulate-Error
          in: header
          required: false
          schema:
            type: string
          description: Test-only header (NODE_ENV=test) to simulate a 500 server error for contract testing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EducationFields"
