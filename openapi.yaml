          required:
            - _id
    CertificationFields:
      title: Certification fields
      description: Editable fields of a certification.
      type: object
      properties:
        institution_name:
          type: string
          example: IIT Roorkee
        certificate_name:
          type: string
          example: Executive PG Certification in Full Stack Web Development
        certificate_id:
          type: string
          nullable: true
          example: IITR-FSD-2026-001
        description:
          type: string
          nullable: true
          example: A comprehensive program covering MERN stack and Java/Spring Boot.
        skills:
          type: string
          nullable: true
          example: React, Node.js, Java, Spring Boot
        start_date:
          type: string
          nullable: true
          example: "2025-06-01"
        end_date:
          type: string
          nullable: true
          example: "2026-05-30"
        is_expired:
          type: boolean
          nullable: true
          example: false
        credential_url:
          type: string
          nullable: true
          example: https://example.com/verify/abc123
        image_url:
          type: string
          nullable: true
          example: https://res.cloudinary.com/demo/image/upload/cert.jpg
        display_order:
          type: integer
          nullable: true
          example: 1
      required:
        - institution_name
        - certificate_name
    Certification:
      title: Certification
      description: A certification entry.
      allOf:
        - $ref: "#/components/schemas/CertificationFields"
        - type: object
          properties:
            _id:
              type: string
              pattern: ^[0-9a-fA-F]{24}$
              example: 64f1a2b3c4d5e6f7a8b9c0d7
            image_public_id:
              type: string
              example: cert_abc123
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            __v:
              type: integer
              example: 0
          required:
            - _id
    LoginFields:
      title: Login fields
      description: Admin login credentials.
      type: object
      properties:
        email:
          type: string
          example: admin@kramesh.dev
        password:
          type: string
          example: SecurePassword123
      required:
        - email
        - password
    LoginResponse:
      title: Login response
      description: JWT token returned on successful login.
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjY0ZjFhMmIzYzRkNWU2ZjdhOGI5YzBkOSJ9.signature
      required:
        - token
