    delete:
      tags:
        - education
      operationId: deleteEducation
      summary: Delete an education entry by ID
      description: Deletes an education record. Requires admin authentication.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          example: 64f1a2b3c4d5e6f7a8b9c0d1
      responses:
        200:
          description: Education entry deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMessage"
        401:
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  $ref: openapi_examples/education_delete_unauthorized.json
        404:
          description: Resource not found.
          content:
            application/json:
